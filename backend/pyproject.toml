[project]
name = "tradingos"
version = "0.1.0"
description = "Trading OS — research, backtesting and (later) automated execution platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
tradingos = "tradingos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call the real OKX public API (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
